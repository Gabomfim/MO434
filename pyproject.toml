[project]
name = "knowledge-distillation"
version = "0.1.0"
description = "Knowledge Distillation experiments for MO434"
requires-python = ">=3.10"

dependencies = [
    "torch==2.2.2",
    "torchvision==0.17.2",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "numpy<2.0",
    "pandas>=2.0.0",
    "jupyter>=1.0.0",
    "ipython>=8.0.0",
    "tqdm==4.67.3",
    "h5py>=3.16.0",
    "scipy==1.15.3; python_version < '3.11'",
    "scipy==1.17.1; python_version >= '3.11'",
    "wandb==0.27.0",
    "kagglehub>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
