[project]
name = "knowledge-distillation"
version = "0.1.0"
description = "Knowledge Distillation experiments for MO434"
requires-python = ">=3.10"
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "matplotlib>=3.10.0",
    "numpy<2.0",
    "pandas>=2.0.0",
    "jupyter>=1.0.0",
    "ipython>=8.0.0",
    "tqdm==4.67.3",
    "scipy==1.15.3; python_version < '3.11'",
    "scipy==1.17.1; python_version >= '3.11'",
    "wandb==0.27.0",
    "modal>=1.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
