[project]
name = "knowledge-distillation"
version = "0.1.0"
description = "Knowledge Distillation experiments for MO434"
requires-python = ">=3.10"

dependencies = [
    "torch==2.2.2",
    "torchvision==0.17.2",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "numpy<2.0",
    "pandas>=2.0.0",
    "jupyter>=1.0.0",
    "ipython>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
